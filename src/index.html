<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura Kiosk OS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      /* ── New light palette ── */
      --sky:  #F0F7FF;
      --sky2: #E3F0FD;
      --sky3: #C8E0FA;
      --ink:  #1A2233;
      --ink2: #4A5568;
      --ink3: #8A95A8;
      --card: #FFFFFF;
      --bd:   #D8E4F0;
      --violet:       #534AB7;
      --violet-light: #EEEDFE;
      --violet-mid:   #AFA9EC;
      --violet-dark:  #3C3489;
      /* semantic */
      --green-bg: #EDFAF3; --green-tx: #1A6640; --green-bd: #86CFAB;
      --blue-bg:  #E6F1FB; --blue-tx:  #0C447C; --blue-bd:  #85B7EB;
      --red-bg:   #FEF0F0; --red-tx:   #8B1F1F; --red-bd:   #F09595;
      --amber-tx: #7A4A00;
      --rmd: 10px; --rlg: 16px;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--sky);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .kiosk { width: 100%; max-width: 700px; }

    /* ── Status bar ── */
    #status-bar {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 1.5rem; padding: 10px 14px;
      border-radius: var(--rmd); font-size: 13px;
      border: 0.5px solid transparent;
    }
    .status-ok          { background: var(--green-bg); color: var(--green-tx); border-color: var(--green-bd); }
    .status-err         { background: var(--red-bg);   color: var(--red-tx);   border-color: var(--red-bd);   }
    .status-connecting  { background: var(--blue-bg);  color: var(--blue-tx);  border-color: var(--blue-bd);  }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }

    /* ── Header ── */
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 12px; }
    .logo { font-size: 21px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
    .logo span { color: var(--violet); }
    .cpp-tag {
      font-size: 11px; font-weight: 500;
      background: var(--violet-light); color: var(--violet);
      border: 0.5px solid var(--violet-mid);
      border-radius: 20px; padding: 3px 10px;
    }

    /* ── Mode badge ── */
    .badge { font-size: 12px; padding: 5px 12px; border-radius: 20px; font-weight: 500; border: 0.5px solid transparent; }
    .badge-normal    { background: var(--green-bg); color: var(--green-tx); border-color: var(--green-bd); }
    .badge-sale      { background: var(--blue-bg);  color: var(--blue-tx);  border-color: var(--blue-bd);  }
    .badge-emergency { background: var(--red-bg);   color: var(--red-tx);   border-color: var(--red-bd);   }

    /* ── Section label ── */
    .section-label { font-size: 11px; font-weight: 500; color: var(--ink3); text-transform: uppercase; letter-spacing: 0.9px; margin-bottom: 10px; }

    /* ── Pricing buttons ── */
    .pricing-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
    .pricing-btn {
      flex: 1; padding: 10px 0;
      border-radius: var(--rmd); border: 0.5px solid var(--bd);
      background: var(--card); color: var(--ink2);
      font-size: 13px; cursor: pointer; transition: all .15s;
    }
    .pricing-btn:hover { background: var(--sky2); border-color: var(--sky3); }
    .pricing-btn.active-standard   { background: var(--green-bg); color: var(--green-tx); border-color: var(--green-bd); font-weight: 500; }
    .pricing-btn.active-discounted { background: var(--blue-bg);  color: var(--blue-tx);  border-color: var(--blue-bd);  font-weight: 500; }
    .pricing-btn.active-emergency  { background: var(--red-bg);   color: var(--red-tx);   border-color: var(--red-bd);   font-weight: 500; }

    /* ── Stats ── */
    .stats-row { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .stat { background: var(--sky2); border-radius: var(--rmd); padding: 14px 16px; }
    .stat-label { font-size: 11px; color: var(--ink3); margin-bottom: 5px; }
    .stat-val   { font-size: 22px; font-weight: 500; color: var(--ink); }

    /* ── Product cards ── */
    .products-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin-bottom: 1.5rem; }
    .product-card {
      background: var(--card); border: 0.5px solid var(--bd);
      border-radius: var(--rlg); padding: 16px; cursor: pointer; transition: all .15s;
    }
    .product-card:hover    { border-color: #A8C4E0; background: var(--sky); }
    .product-card.selected { border: 1.5px solid var(--violet); background: var(--violet-light); }
    .product-card.out      { opacity: .4; pointer-events: none; }
    .prod-tag   { display: inline-block; font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 20px; margin-bottom: 8px; }
    .prod-tag.t-std  { background: var(--green-bg); color: var(--green-tx); }
    .prod-tag.t-sale { background: var(--blue-bg);  color: var(--blue-tx);  }
    .prod-tag.t-em   { background: var(--red-bg);   color: var(--red-tx);   }
    .prod-name  { font-size: 14px; font-weight: 500; margin-bottom: 6px; color: var(--ink); }
    .prod-price { font-size: 24px; font-weight: 500; margin-bottom: 2px; color: var(--ink); line-height: 1; }
    .prod-base  { font-size: 11px; color: var(--ink3); text-decoration: line-through; display: none; margin-bottom: 2px; }
    .prod-stock { font-size: 12px; color: var(--ink3); }
    .stock-low  { color: var(--amber-tx); }
    .stock-out  { color: var(--red-tx); }

    /* ── Purchase panel ── */
    .purchase-panel {
      background: var(--card); border: 0.5px solid var(--bd);
      border-radius: var(--rlg); padding: 1.25rem; margin-bottom: 1.5rem;
    }
    .purchase-panel h3 { font-size: 15px; font-weight: 500; color: var(--ink); margin-bottom: 1rem; }
    .qty-row { display: flex; align-items: center; gap: 14px; margin-bottom: 1rem; }
    .qty-btn {
      width: 34px; height: 34px; border-radius: var(--rmd);
      border: 0.5px solid var(--bd); background: var(--sky2);
      color: var(--ink); font-size: 18px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background .15s;
    }
    .qty-btn:hover { background: var(--sky3); }
    .qty-val { font-size: 20px; font-weight: 500; min-width: 32px; text-align: center; }
    .divider { height: 0.5px; background: var(--bd); margin-bottom: 1rem; }
    .total-row { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1rem; }
    .total-label { font-size: 13px; color: var(--ink2); }
    .total-val   { font-size: 28px; font-weight: 500; color: var(--ink); }
    .buy-btn {
      width: 100%; padding: 12px; border-radius: var(--rmd); border: none;
      background: var(--violet); color: #fff; font-size: 15px; font-weight: 500;
      cursor: pointer; transition: background .15s;
    }
    .buy-btn:hover    { background: var(--violet-dark); }
    .buy-btn:disabled { background: var(--bd); color: var(--ink3); cursor: not-allowed; }
    .no-select { font-size: 13px; color: var(--ink3); text-align: center; padding: 1.5rem 0; }

    /* ── Log ── */
    .log-section { background: var(--sky2); border-radius: var(--rlg); padding: 1rem 1.25rem; }
    .log-entry {
      font-size: 13px; padding: 8px 0;
      border-bottom: 0.5px solid var(--bd);
      color: var(--ink2); display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .log-entry:last-child { border-bottom: none; }
    .log-entry-main { color: var(--ink2); }
    .log-entry-sub  { font-size: 11px; color: var(--ink3); margin-top: 1px; }
    .log-ok   { color: var(--green-tx); font-size: 13px; font-weight: 500; }
    .log-fail { color: var(--red-tx);   font-size: 12px; }
    .log-empty { font-size: 13px; color: var(--ink3); text-align: center; padding: 1rem 0; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--ink); color: #fff;
      border-radius: var(--rmd); padding: 10px 20px;
      font-size: 13px; opacity: 0; transition: opacity .2s;
      pointer-events: none; z-index: 100; white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ── Spinner ── */
    .spinner-inline {
      display: inline-block; width: 12px; height: 12px;
      border: 1.5px solid var(--bd); border-top-color: var(--violet);
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="kiosk">

  <div id="status-bar" class="status-connecting">
    <div class="dot"></div>
    <span id="status-text">Connecting to C++ server...</span>
  </div>

  <div class="header">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="logo"><span>Aura</span> Kiosk OS</div>
      <div class="cpp-tag">C++ backend</div>
    </div>
    <div id="mode-badge" class="badge badge-normal">Standard mode</div>
  </div>

  <div class="section-label">Pricing strategy</div>
  <div class="pricing-row">
    <button class="pricing-btn active-standard"  onclick="setPricing('Standard')">Standard</button>
    <button class="pricing-btn"                  onclick="setPricing('Discounted')">Sale — 10% off</button>
    <button class="pricing-btn"                  onclick="setPricing('Emergency')">Emergency — 50% off</button>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="stat-label">Total revenue</div><div class="stat-val" id="stat-rev">$0.00</div></div>
    <div class="stat"><div class="stat-label">Transactions</div><div class="stat-val" id="stat-tx">0</div></div>
    <div class="stat"><div class="stat-label">Items sold</div><div class="stat-val" id="stat-items">0</div></div>
  </div>

  <div class="section-label">Select a product</div>
  <div class="products-grid" id="products-grid">
    <div style="grid-column:1/-1;text-align:center;padding:2rem;font-size:13px;color:var(--ink3);">
      <span class="spinner-inline"></span>Loading from C++ server...
    </div>
  </div>

  <div class="purchase-panel">
    <div class="no-select" id="no-select-msg">Select a product above to continue</div>
    <div id="purchase-form" style="display:none;">
      <h3 id="selected-name">—</h3>
      <div class="qty-row">
        <button class="qty-btn" onclick="adjustQty(-1)">−</button>
        <div class="qty-val" id="qty-display">1</div>
        <button class="qty-btn" onclick="adjustQty(1)">+</button>
        <span style="font-size:12px;color:var(--ink3);" id="stock-hint"></span>
      </div>
      <div class="divider"></div>
      <div class="total-row">
        <span class="total-label" id="pricing-label">Standard pricing</span>
        <span class="total-val"   id="total-display">$0.00</span>
      </div>
      <button class="buy-btn" id="buy-btn" onclick="executePurchase()">Confirm purchase</button>
    </div>
  </div>

  <div class="section-label">Transaction log</div>
  <div class="log-section">
    <div class="log-empty" id="log-empty">No transactions yet</div>
    <div id="log-list"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:8080';

let products      = [];
let currentPolicy = 'Standard';
let selectedId    = null;
let qty           = 1;
let totalRev = 0, totalTx = 0, totalItems = 0;
const logs = [];

const pricingMeta = {
  Standard:   { label:'Standard pricing',        badgeClass:'badge-normal',    btnClass:'active-standard',   modeText:'Standard mode', tagClass:'t-std',  tagTxt:'Standard' },
  Discounted: { label:'Sale pricing (10% off)',   badgeClass:'badge-sale',      btnClass:'active-discounted', modeText:'Weekend sale',   tagClass:'t-sale', tagTxt:'10% off'  },
  Emergency:  { label:'Emergency pricing (50% off)', badgeClass:'badge-emergency', btnClass:'active-emergency',  modeText:'Emergency mode', tagClass:'t-em',   tagTxt:'50% off'  }
};

async function fetchInventory() {
  // GET /inventory  →  C++ Inventory::getProduct()
  const res  = await fetch(`${API}/inventory`);
  const data = await res.json();
  products   = data.map(p => ({ id: p.id, name: p.name, basePrice: p.basePrice, stock: p.stock, displayPrice: p.basePrice }));
  renderProducts();
}

async function fetchPricing() {
  // GET /pricing  →  C++ CentralRegistry::getPricingPolicy()
  const res = await fetch(`${API}/pricing`);
  const d   = await res.json();
  currentPolicy = d.policy;
}

async function setPricing(policy) {
  // POST /pricing  →  C++ CentralRegistry::setPricingPolicy()
  await fetch(`${API}/pricing`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ policy })
  });
  currentPolicy = policy;

  const modes = ['Standard','Discounted','Emergency'];
  document.querySelectorAll('.pricing-btn').forEach((b,i) => {
    b.className = 'pricing-btn' + (modes[i]===policy ? ' '+pricingMeta[policy].btnClass : '');
  });
  const badge = document.getElementById('mode-badge');
  badge.className   = 'badge ' + pricingMeta[policy].badgeClass;
  badge.textContent = pricingMeta[policy].modeText;

  await fetchInventory();
  await refreshPrices();
  updatePurchasePanel();
}

async function refreshPrices() {
  // POST /preview for each product  →  C++ PricingStrategy::calculatePrice()
  await Promise.all(products.map(async p => {
    const res = await fetch(`${API}/preview`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: p.id, qty: 1 })
    });
    const d = await res.json();
    p.displayPrice = d.price;
  }));
  renderProducts();
}

async function executePurchase() {
  if (!selectedId) return;
  document.getElementById('buy-btn').disabled = true;

  // POST /purchase  →  C++ PurchaseCommand::execute()  →  deducts real stock
  const res    = await fetch(`${API}/purchase`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id: selectedId, qty })
  });
  const result = await res.json();

  if (result.success) {
    totalRev   += result.finalPrice;
    totalTx++;
    totalItems += qty;
    logs.unshift({ name: products.find(p=>p.id===selectedId)?.name, qty, total:result.finalPrice, pricing:pricingMeta[currentPolicy].label, ok:true });
    document.getElementById('stat-rev').textContent   = '$' + totalRev.toFixed(2);
    document.getElementById('stat-tx').textContent    = totalTx;
    document.getElementById('stat-items').textContent = totalItems;
    showToast('Purchase complete — $' + result.finalPrice.toFixed(2));
  } else {
    logs.unshift({ name: products.find(p=>p.id===selectedId)?.name, qty, total:0, ok:false });
    showToast('Insufficient stock');
  }

  // Re-fetch from server — stock updated in C++ Inventory object
  await fetchInventory();
  await refreshPrices();
  renderLog();
  qty = 1;
  updatePurchasePanel();
}

// ── UI ────────────────────────────────────────────────────────────────────

function renderProducts() {
  const grid = document.getElementById('products-grid');
  const meta = pricingMeta[currentPolicy];
  grid.innerHTML = products.map(p => {
    const price      = p.displayPrice ?? p.basePrice;
    const isDiscount = currentPolicy !== 'Standard';
    const isSelected = selectedId === p.id;
    const outOfStock = p.stock === 0;
    const lowStock   = p.stock > 0 && p.stock <= 5;
    const stockClass = outOfStock ? 'stock-out' : lowStock ? 'stock-low' : '';
    const stockText  = outOfStock ? 'Out of stock' : `${p.stock} in stock`;
    return `
      <div class="product-card${isSelected?' selected':''}${outOfStock?' out':''}" onclick="selectProduct('${p.id}')">
        <div class="prod-tag ${meta.tagClass}">${meta.tagTxt}</div>
        <div class="prod-name">${p.name}</div>
        <div class="prod-price">$${price.toFixed(2)}</div>
        ${isDiscount ? `<div class="prod-base" style="display:block;">$${p.basePrice.toFixed(2)}</div>` : ''}
        <div class="prod-stock ${stockClass}">${stockText}</div>
      </div>`;
  }).join('');
}

function selectProduct(id) {
  selectedId = id; qty = 1;
  renderProducts();
  updatePurchasePanel();
}

async function adjustQty(d) {
  const prod = products.find(p => p.id === selectedId);
  if (!prod) return;
  qty = Math.max(1, Math.min(qty + d, prod.stock));
  // POST /preview  →  C++ calculates price for current qty
  const res  = await fetch(`${API}/preview`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id: selectedId, qty })
  });
  const data = await res.json();
  document.getElementById('qty-display').textContent   = qty;
  document.getElementById('total-display').textContent = '$' + data.price.toFixed(2);
  document.getElementById('buy-btn').disabled          = prod.stock < qty;
}

function updatePurchasePanel() {
  const prod = selectedId ? products.find(p => p.id === selectedId) : null;
  document.getElementById('no-select-msg').style.display = prod ? 'none' : '';
  document.getElementById('purchase-form').style.display = prod ? '' : 'none';
  if (!prod) return;
  const price = prod.displayPrice ?? prod.basePrice;
  document.getElementById('selected-name').textContent  = prod.name;
  document.getElementById('stock-hint').textContent     = `max ${prod.stock}`;
  document.getElementById('qty-display').textContent    = qty;
  document.getElementById('total-display').textContent  = '$' + (price * qty).toFixed(2);
  document.getElementById('pricing-label').textContent  = pricingMeta[currentPolicy].label;
  document.getElementById('buy-btn').disabled           = prod.stock < qty;
}

function renderLog() {
  const el    = document.getElementById('log-list');
  const empty = document.getElementById('log-empty');
  if (!logs.length) { empty.style.display=''; el.innerHTML=''; return; }
  empty.style.display = 'none';
  el.innerHTML = logs.slice(0,8).map(l =>
    `<div class="log-entry">
      <div>
        <div class="log-entry-main">${l.name} × ${l.qty}</div>
        ${l.ok ? `<div class="log-entry-sub">${l.pricing}</div>` : ''}
      </div>
      ${l.ok ? `<span class="log-ok">+$${l.total.toFixed(2)}</span>` : `<span class="log-fail">failed</span>`}
    </div>`
  ).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

function setStatus(type, text) {
  document.getElementById('status-bar').className = `status-${type}`;
  document.getElementById('status-text').textContent = text;
}

// ── Boot ──────────────────────────────────────────────────────────────────
(async () => {
  try {
    await fetchInventory();
    await fetchPricing();
    await refreshPrices();
    setStatus('ok', 'Connected to C++ server (localhost:8080)');
  } catch (e) {
    setStatus('err', 'Cannot reach C++ server — run: g++ server.cpp -o server && ./server');
  }
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aura Kiosk OS</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg1: #ffffff; --bg2: #f5f5f3; --bg3: #eeecea;
      --t1: #1a1a18;  --t2: #5f5e5a; --t3: #888780;
      --b1: rgba(0,0,0,0.22); --b2: rgba(0,0,0,0.12);
      --rmd: 8px; --rlg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg1: #1e1e1c; --bg2: #2a2a28; --bg3: #333331;
        --t1: #f0ede8;  --t2: #a8a7a2; --t3: #6e6d69;
        --b1: rgba(255,255,255,0.20); --b2: rgba(255,255,255,0.10);
      }
    }
    body { font-family: system-ui,-apple-system,sans-serif; background: var(--bg3); color: var(--t1); min-height:100vh; display:flex; justify-content:center; padding: 2rem 1rem; }
    .kiosk { width:100%; max-width:700px; }

    #status-bar { display:flex; align-items:center; gap:8px; margin-bottom:1.5rem; padding:10px 14px; border-radius:var(--rmd); font-size:13px; }
    .status-ok          { background:#EAF3DE; color:#3B6D11; }
    .status-err         { background:#FCEBEB; color:#A32D2D; }
    .status-connecting  { background:#E6F1FB; color:#185FA5; }
    .dot { width:7px; height:7px; border-radius:50%; background:currentColor; flex-shrink:0; }

    .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:1.5rem; flex-wrap:wrap; gap:12px; }
    .logo { font-size:20px; font-weight:500; }
    .logo span { color:#534AB7; }
    .cpp-tag { font-size:10px; font-weight:500; background:#EEEDFE; color:#534AB7; border:0.5px solid #AFA9EC; border-radius:var(--rmd); padding:3px 8px; }

    .badge { font-size:12px; padding:4px 10px; border-radius:var(--rmd); font-weight:500; }
    .badge-normal    { background:#EAF3DE; color:#3B6D11; }
    .badge-sale      { background:#E6F1FB; color:#185FA5; }
    .badge-emergency { background:#FCEBEB; color:#A32D2D; }

    .section-label { font-size:11px; font-weight:500; color:var(--t3); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:8px; }

    .pricing-row { display:flex; gap:8px; margin-bottom:1.5rem; }
    .pricing-btn { flex:1; padding:9px 0; border-radius:var(--rmd); border:0.5px solid var(--b1); background:var(--bg2); color:var(--t2); font-size:13px; cursor:pointer; transition:all .15s; }
    .pricing-btn:hover { background:var(--bg1); }
    .pricing-btn.active-standard   { background:#EAF3DE; color:#3B6D11; border-color:#639922; }
    .pricing-btn.active-discounted { background:#E6F1FB; color:#185FA5; border-color:#378ADD; }
    .pricing-btn.active-emergency  { background:#FCEBEB; color:#A32D2D; border-color:#E24B4A; }

    .stats-row { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:1.5rem; }
    .stat { background:var(--bg2); border-radius:var(--rmd); padding:12px; }
    .stat-label { font-size:11px; color:var(--t3); margin-bottom:4px; }
    .stat-val   { font-size:20px; font-weight:500; }

    .products-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; margin-bottom:1.5rem; }
    .product-card { background:var(--bg1); border:0.5px solid var(--b2); border-radius:var(--rlg); padding:14px; cursor:pointer; transition:all .15s; }
    .product-card:hover    { border-color:var(--b1); }
    .product-card.selected { border:1.5px solid #534AB7; background:#EEEDFE; }
    .product-card.out      { opacity:.4; pointer-events:none; }
    .prod-name  { font-size:14px; font-weight:500; margin-bottom:4px; }
    .prod-price { font-size:22px; font-weight:500; margin-bottom:2px; }
    .prod-base  { font-size:11px; color:var(--t3); text-decoration:line-through; display:none; }
    .prod-stock { font-size:12px; color:var(--t2); }
    .stock-low  { color:#BA7517; }
    .stock-out  { color:#A32D2D; }

    .purchase-panel { background:var(--bg1); border:0.5px solid var(--b2); border-radius:var(--rlg); padding:1.25rem; margin-bottom:1.5rem; }
    .purchase-panel h3 { font-size:14px; font-weight:500; color:var(--t2); margin-bottom:1rem; }
    .qty-row { display:flex; align-items:center; gap:12px; margin-bottom:1rem; }
    .qty-btn { width:32px; height:32px; border-radius:var(--rmd); border:0.5px solid var(--b1); background:var(--bg2); color:var(--t1); font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
    .qty-btn:hover { background:var(--bg1); }
    .qty-val { font-size:20px; font-weight:500; min-width:32px; text-align:center; }
    .total-row { display:flex; justify-content:space-between; align-items:baseline; padding-top:12px; border-top:0.5px solid var(--b2); margin-bottom:1rem; }
    .total-label { font-size:13px; color:var(--t2); }
    .total-val   { font-size:26px; font-weight:500; }
    .buy-btn { width:100%; padding:11px; border-radius:var(--rmd); border:none; background:#534AB7; color:#fff; font-size:15px; font-weight:500; cursor:pointer; transition:all .15s; }
    .buy-btn:hover    { background:#3C3489; }
    .buy-btn:disabled { background:var(--bg2); color:var(--t3); cursor:not-allowed; }
    .no-select { font-size:13px; color:var(--t3); text-align:center; padding:1.5rem 0; }

    .log-section { background:var(--bg2); border-radius:var(--rlg); padding:1rem; }
    .log-entry { font-size:13px; padding:7px 0; border-bottom:0.5px solid var(--b2); color:var(--t2); display:flex; justify-content:space-between; gap:12px; }
    .log-entry:last-child { border-bottom:none; }
    .log-ok   { color:#3B6D11; font-size:12px; }
    .log-fail { color:#A32D2D; font-size:12px; }
    .log-empty { font-size:13px; color:var(--t3); text-align:center; padding:1rem 0; }

    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--bg1); border:0.5px solid var(--b1); border-radius:var(--rmd); padding:10px 18px; font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; z-index:100; }
    .toast.show { opacity:1; }
    .spinner-inline { display:inline-block; width:12px; height:12px; border:1.5px solid var(--b2); border-top-color:#534AB7; border-radius:50%; animation:spin .7s linear infinite; vertical-align:middle; margin-right:6px; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>
<div class="kiosk">

  <div id="status-bar" class="status-connecting">
    <div class="dot"></div>
    <span id="status-text">Connecting to C++ server...</span>
  </div>

  <div class="header">
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="logo"><span>Aura</span> Kiosk OS</div>
      <div class="cpp-tag">C++ backend</div>
    </div>
    <div id="mode-badge" class="badge badge-normal">Standard mode</div>
  </div>

  <div class="section-label">Pricing strategy</div>
  <div class="pricing-row">
    <button class="pricing-btn active-standard"  onclick="setPricing('Standard')">Standard</button>
    <button class="pricing-btn"                  onclick="setPricing('Discounted')">Sale (10% off)</button>
    <button class="pricing-btn"                  onclick="setPricing('Emergency')">Emergency (50% off)</button>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="stat-label">Total revenue</div><div class="stat-val" id="stat-rev">$0.00</div></div>
    <div class="stat"><div class="stat-label">Transactions</div><div class="stat-val" id="stat-tx">0</div></div>
    <div class="stat"><div class="stat-label">Items sold</div><div class="stat-val" id="stat-items">0</div></div>
  </div>

  <div class="section-label">Select a product</div>
  <div class="products-grid" id="products-grid">
    <div style="grid-column:1/-1;text-align:center;padding:2rem;font-size:13px;color:var(--t3);">
      <span class="spinner-inline"></span>Loading from C++ server...
    </div>
  </div>

  <div class="purchase-panel">
    <div class="no-select" id="no-select-msg">Select a product above to continue</div>
    <div id="purchase-form" style="display:none;">
      <h3 id="selected-name">—</h3>
      <div class="qty-row">
        <button class="qty-btn" onclick="adjustQty(-1)">−</button>
        <div class="qty-val" id="qty-display">1</div>
        <button class="qty-btn" onclick="adjustQty(1)">+</button>
        <span style="font-size:13px;color:var(--t3);" id="stock-hint"></span>
      </div>
      <div class="total-row">
        <span class="total-label" id="pricing-label">Standard pricing</span>
        <span class="total-val"   id="total-display">$0.00</span>
      </div>
      <button class="buy-btn" id="buy-btn" onclick="executePurchase()">Confirm purchase</button>
    </div>
  </div>

  <div class="section-label">Transaction log</div>
  <div class="log-section">
    <div class="log-empty" id="log-empty">No transactions yet</div>
    <div id="log-list"></div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:8080';

let products      = [];
let currentPolicy = 'Standard';
let selectedId    = null;
let qty           = 1;
let totalRev = 0, totalTx = 0, totalItems = 0;
const logs = [];

const pricingMeta = {
  Standard:   { label:'Standard pricing',       badgeClass:'badge-normal',    btnClass:'active-standard',   modeText:'Standard mode' },
  Discounted: { label:'Sale pricing (10% off)',  badgeClass:'badge-sale',      btnClass:'active-discounted', modeText:'Weekend sale'   },
  Emergency:  { label:'Emergency (50% off)',     badgeClass:'badge-emergency', btnClass:'active-emergency',  modeText:'Emergency mode' }
};

// ── API calls → C++ server ────────────────────────────────────────────────

async function fetchInventory() {
  // GET /inventory  →  C++ inventoryJSON()  →  reads Inventory object
  const res = await fetch(`${API}/inventory`);
  products  = await res.json();
}

async function fetchPricing() {
  // GET /pricing  →  C++ CentralRegistry::getPricingPolicy()
  const res = await fetch(`${API}/pricing`);
  const d   = await res.json();
  currentPolicy = d.policy;
}

async function setPricing(policy) {
  // POST /pricing  →  C++ CentralRegistry::setPricingPolicy()
  await fetch(`${API}/pricing`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ policy })
  });
  currentPolicy = policy;

  const modes = ['Standard','Discounted','Emergency'];
  document.querySelectorAll('.pricing-btn').forEach((b,i) => {
    b.className = 'pricing-btn' + (modes[i]===policy ? ' '+pricingMeta[policy].btnClass : '');
  });
  const badge = document.getElementById('mode-badge');
  badge.className   = 'badge ' + pricingMeta[policy].badgeClass;
  badge.textContent = pricingMeta[policy].modeText;

  await fetchInventory();
  await refreshPrices();
  updatePurchasePanel();
}

async function refreshPrices() {
  // POST /preview for each product  →  C++ PricingStrategy::calculatePrice()
  await Promise.all(products.map(async p => {
    const res  = await fetch(`${API}/preview`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ id: p.id, qty: 1 })
    });
    const d    = await res.json();
    p.displayPrice = d.price;
  }));
  renderProducts();
}

async function executePurchase() {
  if (!selectedId) return;
  document.getElementById('buy-btn').disabled = true;

  // POST /purchase  →  C++ PurchaseCommand::execute()  →  deducts real stock
  const res    = await fetch(`${API}/purchase`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id: selectedId, qty })
  });
  const result = await res.json();

  if (result.success) {
    totalRev   += result.finalPrice;
    totalTx++;
    totalItems += qty;
    logs.unshift({ name: products.find(p=>p.id===selectedId)?.name, qty, total:result.finalPrice, pricing:pricingMeta[currentPolicy].label, ok:true });
    document.getElementById('stat-rev').textContent   = '$' + totalRev.toFixed(2);
    document.getElementById('stat-tx').textContent    = totalTx;
    document.getElementById('stat-items').textContent = totalItems;
    showToast('Purchase successful');
  } else {
    logs.unshift({ name: products.find(p=>p.id===selectedId)?.name, qty, total:0, ok:false });
    showToast('Insufficient stock');
  }

  // Re-fetch from server — stock updated in C++ Inventory object
  await fetchInventory();
  await refreshPrices();
  renderLog();
  qty = 1;
  updatePurchasePanel();
}

// ── UI ────────────────────────────────────────────────────────────────────

function renderProducts() {
  const grid = document.getElementById('products-grid');
  grid.innerHTML = products.map(p => {
    const price      = p.displayPrice ?? p.basePrice;
    const isDiscount = currentPolicy !== 'Standard';
    const isSelected = selectedId === p.id;
    const outOfStock = p.stock === 0;
    const lowStock   = p.stock > 0 && p.stock <= 5;
    const stockClass = outOfStock ? 'stock-out' : lowStock ? 'stock-low' : '';
    const stockText  = outOfStock ? 'Out of stock' : `${p.stock} in stock`;
    return `
      <div class="product-card${isSelected?' selected':''}${outOfStock?' out':''}" onclick="selectProduct('${p.id}')">
        <div class="prod-name">${p.name}</div>
        <div class="prod-price">$${price.toFixed(2)}</div>
        ${isDiscount ? `<div class="prod-base" style="display:block;">$${p.basePrice.toFixed(2)}</div>` : ''}
        <div class="prod-stock ${stockClass}">${stockText}</div>
      </div>`;
  }).join('');
}

function selectProduct(id) {
  selectedId = id; qty = 1;
  renderProducts();
  updatePurchasePanel();
}

async function adjustQty(d) {
  const prod = products.find(p => p.id === selectedId);
  if (!prod) return;
  qty = Math.max(1, Math.min(qty + d, prod.stock));
  // POST /preview  →  C++ calculates price for current qty
  const res  = await fetch(`${API}/preview`, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id: selectedId, qty })
  });
  const data = await res.json();
  document.getElementById('qty-display').textContent   = qty;
  document.getElementById('total-display').textContent = '$' + data.price.toFixed(2);
  document.getElementById('buy-btn').disabled          = prod.stock < qty;
}

function updatePurchasePanel() {
  const prod = selectedId ? products.find(p => p.id === selectedId) : null;
  document.getElementById('no-select-msg').style.display = prod ? 'none' : '';
  document.getElementById('purchase-form').style.display = prod ? '' : 'none';
  if (!prod) return;
  const price = prod.displayPrice ?? prod.basePrice;
  document.getElementById('selected-name').textContent  = prod.name;
  document.getElementById('stock-hint').textContent     = `max ${prod.stock}`;
  document.getElementById('qty-display').textContent    = qty;
  document.getElementById('total-display').textContent  = '$' + (price * qty).toFixed(2);
  document.getElementById('pricing-label').textContent  = pricingMeta[currentPolicy].label;
  document.getElementById('buy-btn').disabled           = prod.stock < qty;
}

function renderLog() {
  const el    = document.getElementById('log-list');
  const empty = document.getElementById('log-empty');
  if (!logs.length) { empty.style.display=''; el.innerHTML=''; return; }
  empty.style.display = 'none';
  el.innerHTML = logs.slice(0,8).map(l =>
    `<div class="log-entry">
      <span>${l.name} x${l.qty} ${l.ok?`<span style="font-size:11px;color:var(--t3);">(${l.pricing})</span>`:''}
      </span>
      ${l.ok?`<span class="log-ok">+$${l.total.toFixed(2)}</span>`:`<span class="log-fail">failed</span>`}
    </div>`
  ).join('');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function setStatus(type, text) {
  document.getElementById('status-bar').className = `status-${type}`;
  document.getElementById('status-text').textContent = text;
}

// ── Boot ──────────────────────────────────────────────────────────────────
(async () => {
  try {
    await fetchInventory();
    await fetchPricing();
    await refreshPrices();
    setStatus('ok', 'Connected to C++ server (localhost:8080)');
  } catch (e) {
    setStatus('err', 'Cannot reach C++ server — run: g++ server.cpp -o server && ./server');
  }
})();
</script>
</body>
</html>
